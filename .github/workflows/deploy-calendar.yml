name: Deploy calendar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json 의 packageManager 버전 사용
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # .ts 직접 실행(타입 스트리핑) — 로컬과 동일
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @escape-from-home/somoim sync
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/calendar/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
