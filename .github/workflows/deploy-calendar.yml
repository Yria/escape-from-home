name: Deploy calendar

on:
  push:
    branches: [main]
  # 소모임 게시판을 5분마다(GitHub 예약 실행의 최소 간격) 다시 긁어 data/events.json 으로 구워 재배포한다.
  # GitHub Pages 는 정적이라 방문 시 수집할 수 없어서, 예약 실행이 일종의 캐시 갱신 역할을 한다.
  # 정각 근처는 예약 실행이 몰려 밀리기 쉬워 2분부터 5분 간격(2, 7, 12 …분)으로 돌린다. 공개 저장소라 무료.
  # 저장소에 60일간 커밋이 없으면 GitHub 가 예약 실행을 멈추니, 멈추면 Actions 탭에서 다시 켠다.
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json 의 packageManager 버전 사용
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # .ts 직접 실행(타입 스트리핑) — 로컬과 동일
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @escape-from-home/somoim sync
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/calendar/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
